# 2026 D题陆空协同无人机参数
# 坐标约定：
# 1. MAVROS local 坐标使用 ROS ENU 语义；
# 2. car_udp_bridge 默认输出相对无人机起飞点的 x/y，FSM 会加上 home_x/home_y；
# 3. 小车赛道几何必须在实地用 Faster-LIO 坐标重新标定 A 点与 A->B 航向。

mission:
  default_type: drop                 # drop 或 dynamic_land
  frame: relative_home
  # （调参）主任务状态机与控制指令的运行频率
  control_rate_hz: 50.0
  # （调参）任务状态信息的发布频率
  status_rate_hz: 10.0

  takeoff:
    # （调参）任务巡航高度，相对于起降点地面高度
    cruise_height_m: 1.20            # 相对 H 点地面的巡航高度
    # （调参）任务飞行过程中保持的固定航向角
    yaw_deg: 0.0                    # 全任务固定航向；跟随和半圆伴飞均不使用小车 yaw
    # （调参）起飞完成判定允许的水平位置误差
    xy_tolerance_m: 0.18
    # （调参）起飞完成判定允许的高度误差
    z_tolerance_m: 0.10
    # （调参）起飞完成判定允许的无人机速度
    speed_tolerance_mps: 0.20
    # （调参）起飞条件满足后需要连续保持的时间
    stable_time_s: 0.45            # 仅任务二使用；任务一首次满足阈值就开始3秒计时
    # （调参）任务一起飞后固定悬停等待时间
    drop_hover_time_s: 3.00          # 任务一固定悬停时间；期间不因失稳重置计时
    # （调参）起飞判稳阶段允许等待的最长时间
    max_wait_s: 8.0                  # 起飞判稳最长等待；任务一软超时后仍先悬停3秒
    # （调参）起飞软超时时允许的最大高度误差
    soft_timeout_z_error_m: 0.22

    # 起飞和任务一固定悬停专用水平控制参数
    horizontal_position_kp: 0.80
    max_horizontal_speed_mps: 0.35
    max_horizontal_accel_mps2: 0.35
    max_horizontal_jerk_mps3: 0.60

    # 快速档垂直起飞控制参数
    vertical_position_kp: 0.90
    max_vertical_speed_mps: 0.55
    max_vertical_accel_mps2: 0.75

    # 固定悬停3秒完成后的宽松退出安全门槛
    hover_exit_xy_tolerance_m: 0.30
    hover_exit_z_tolerance_m: 0.18
    hover_exit_speed_tolerance_mps: 0.35

  fcu:
    offboard_prestream_s: 1.0
    mode_request_interval_s: 1.0
    arm_request_interval_s: 1.0
    service_wait_s: 8.0
    auto_set_mode: true
    auto_arm: true

  follow:
    # 无人机目标相对小车平台中心的水平偏置。0,0 表示正上方。
    # （调参）无人机跟随点相对小车平台中心的前后偏置
    offset_forward_m: 0.0
    # （调参）无人机跟随点相对小车平台中心的左右偏置
    offset_left_m: 0.0
    # 动态降落专用状态沿用位置+速度前馈控制；投掷任务使用下方独立参数组。
    # （调参）动态降落专用状态的小车速度前馈增益
    velocity_feedforward_gain: 1.0
    # （调参）跟随阶段高度误差对应垂直速度的比例增益
    vertical_kp: 0.90
    # （调参）动态降落专用状态的水平速度上限
    max_horizontal_speed_mps: 0.75
    # （调参）动态降落专用状态的水平加速度上限
    max_horizontal_accel_mps2: 0.55
    # （调参）动态降落专用状态的水平加速度变化率上限
    max_horizontal_jerk_mps3: 0.90       # 半圆速度方向连续变化时限制加速度突变
    # （调参）跟随阶段允许的最大垂直速度
    max_vertical_speed_mps: 0.45
    # （调参）跟随阶段允许的最大垂直加速度
    max_vertical_accel_mps2: 0.60
    # （调参）截获小车时向前预测小车位置的时间
    intercept_prediction_s: 0.20
    # （调参）稳定伴飞时向前预测小车位置的时间
    follow_prediction_s: 0.08

    # （调参）截获完成判定允许的水平位置误差
    acquire_position_error_m: 0.20
    # （调参）截获完成判定允许的相对速度
    acquire_relative_speed_mps: 0.18
    # （调参）截获条件需要连续保持的时间
    acquire_stable_time_s: 0.45

    # （调参）稳定伴飞判定允许的水平位置误差
    stable_position_error_m: 0.12
    # （调参）稳定伴飞判定允许的相对速度
    stable_relative_speed_mps: 0.10
    # （调参）稳定伴飞条件需要连续保持的时间
    stable_time_s: 0.50

    # 投掷任务移动目标控制：ROS计算完整XY速度，只向PX4发布XY速度设定值。
    velocity_profiles:
      intercept:
        velocity_feedforward_gain: 1.00
        position_kp: 0.95
        relative_velocity_kd: 0.30
        max_horizontal_speed_mps: 0.75
        max_correction_speed_mps: 0.35
        max_horizontal_accel_mps2: 0.55
        max_horizontal_jerk_mps3: 0.90
      follow:
        velocity_feedforward_gain: 1.00
        position_kp: 0.75
        relative_velocity_kd: 0.25
        max_horizontal_speed_mps: 0.75
        max_correction_speed_mps: 0.25
        max_horizontal_accel_mps2: 0.45
        max_horizontal_jerk_mps3: 0.75
      drop_descent:
        velocity_feedforward_gain: 1.00
        position_kp: 0.65
        relative_velocity_kd: 0.25
        max_horizontal_speed_mps: 0.75
        max_correction_speed_mps: 0.18
        max_horizontal_accel_mps2: 0.30
        max_horizontal_jerk_mps3: 0.55
      drop_align:
        velocity_feedforward_gain: 1.00
        position_kp: 0.55
        relative_velocity_kd: 0.30
        max_horizontal_speed_mps: 0.75
        max_correction_speed_mps: 0.12
        max_horizontal_accel_mps2: 0.22
        max_horizontal_jerk_mps3: 0.40

  estimator:
    # （调参）小车遥测数据判定失效的超时时间
    telemetry_timeout_s: 0.50
    # （调参）视觉小车数据判定失效的超时时间
    vision_timeout_s: 0.35
    # （调参）小车遥测位置滤波系数
    telemetry_position_alpha: 0.70       # 假小车坐标为连续真值，提高响应并减少弯道滞后
    # （调参）小车遥测速度滤波系数
    telemetry_velocity_alpha: 0.75
    # （调参）视觉位置滤波系数
    vision_position_alpha: 0.72
    # （调参）位置变化修正速度估计的系数
    position_beta: 0.015
    # （调参）估计器允许的小车最大速度
    max_car_speed_mps: 0.65
    # （调参）小车状态外推允许的最长预测时间
    max_prediction_s: 0.30
    curve_prediction_enabled: true       # BC/DA 使用恒曲率预测，不再沿切线直线外推
    # （调参）BC、DA 半圆预测所使用的轨迹半径
    curve_prediction_radius_m: 0.75
    # （调参）恒曲率预测的转弯方向符号
    curve_turn_direction: 1.0            # 当前跑道模型中 BC/DA 的 local yaw 均随里程增大
    # （调参）视觉数据参与融合所需的最低置信度
    vision_min_confidence: 0.55
    # （调参）视觉目标连续稳定后才采用的帧数
    vision_min_stable_count: 2
    car_state_is_relative_home: true
    # 合成视觉与虚拟小车里程给出的是同一真值，不重复修正跟踪器速度。
    fuse_synthetic_vision: false

  drop:
    # 任务一只在 C-D 直线段内下降和投放。
    segment_name: CD

    # 进入 C-D 后先边跟车边下降。下降可在正式投放窗口之前开始，
    # 这样到 window_start 时已经接近目标高度，不必占用瞄准时间。
    # （调参）进入 CD 段后开始下降的赛段进度比例
    descent_window_start: 0.05

    # 0.35m 的定义：无人机控制点到小车平台表面的垂直间距。
    # 平台表面高度 = home_z + platform_height_m；因此默认最终 local Z
    # 为 home_z + 0.34 + 0.35 = home_z + 0.69m，而不是距地面仅0.35m。
    # （调参）起降点地面到小车平台表面的实测高度
    platform_height_m: 0.34          # H点地面到小车平台表面，必须现场实测
    # （调参）投放时无人机控制点高于小车平台的目标距离
    target_height_above_platform_m: 0.35

    # 下降过程模仿动态降落：XY持续跟车，Z目标按速度逐步降低；
    # 位置/相对速度误差过大或视觉暂时无效时，只暂停下降，不停止XY跟随。
    # （调参）投放下降阶段的正常目标下降速度
    descent_rate_mps: 0.20
    # （调参）接近投放高度时的慢速下降速度
    descent_final_rate_mps: 0.10
    # （调参）切换到慢速下降的剩余高度范围
    descent_slow_height_m: 0.25      # 距最终目标高度小于该值时切换慢速下降
    # （调参）超过该水平误差时暂停继续下降
    descent_pause_position_error_m: 0.14
    # （调参）超过该相对速度时暂停继续下降
    descent_pause_relative_speed_mps: 0.12
    # （调参）下降阶段视觉持续失效的允许时间
    descent_vision_abort_timeout_s: 0.60
    # （调参）判断到达投放高度允许的高度误差
    descent_z_tolerance_m: 0.05
    # （调参）判断下降稳定允许的垂直速度
    descent_vertical_speed_mps: 0.12
    # （调参）下降到位条件需要连续保持的时间
    descent_reached_stable_time_s: 0.30

    # 投放出口相对无人机控制中心的物理偏置。
    # release_offset_frame=body 时：+X=机头前方，+Y=机体左方；代码会自动取反补偿。
    # release_offset_frame=local 时：+X/+Y 与 MAVROS local ENU 一致。
    # 例：投放出口位于机头前方 0.06m，则 x=0.06, y=0.00。
    release_offset_frame: body       # body 或 local
    # （调参）投放出口相对无人机控制中心的 X 方向偏置
    release_offset_x_m: 0.00         # 单位 m，现场测量/投放标定后修改
    # （调参）投放出口相对无人机控制中心的 Y 方向偏置
    release_offset_y_m: 0.00         # 单位 m，现场测量/投放标定后修改
    # 经验投放提前距离：正值沿小车运动方向提前，负值向后修正。
    # 初始保持 0；待投放物、小车速度和无人机速度确定后按落点试验修改。
    empirical_release_lead_distance_m: 0.00
    # （调参）CD 段允许正式投放的起始进度比例
    window_start: 0.20
    # （调参）CD 段允许正式投放的结束进度比例
    window_end: 0.78
    # （调参）精确瞄准完成允许的水平位置误差
    align_position_error_m: 0.075
    # （调参）精确瞄准完成允许的相对速度
    align_relative_speed_mps: 0.075
    # （调参）精确瞄准条件需要连续保持的时间
    align_stable_time_s: 0.45
    # （调参）精确瞄准阶段允许等待的最长时间
    align_timeout_s: 1.50           # 精确瞄准超过 1.5 秒且仍在窗口内时直接投放
    # （调参）投放物从释放到落到平台的估计时间
    fall_time_s: 0.58               # 改为低空投放后必须重新实测标定
    # （调参）预测落点允许的最大水平误差
    predicted_error_limit_m: 0.085
    vision_required: true
    command: A90
    # （调参）单次投放指令等待执行确认的时间
    ack_timeout_s: 1.80
    # （调参）投放指令未确认时的重发间隔
    retry_interval_s: 0.55
    # （调参）投放指令允许的最大重试次数
    max_retries: 3
    # （调参）投放完成后进入返航前的状态保持时间
    post_drop_follow_s: 1.20
    # （调参）投放完成后恢复高度时的最大上升速度
    post_drop_climb_speed_mps: 0.40      # 投掷后缓慢抬升，不再使用全局0.45m/s上限
    # （调参）投放完成后恢复高度时的最大垂直加速度
    post_drop_climb_accel_mps2: 0.30

  dynamic_landing:
    # 用户已确定：只允许在 C-D 直线段下降和着陆。
    segment_name: CD
    window_start: 0.05
    latest_start: 0.22
    abort_progress: 0.96
    max_attempts_in_cd: 2

    platform_height_m: 0.34          # H点地面到小车平台表面，必须实测
    entry_position_error_m: 0.12
    entry_relative_speed_mps: 0.10
    entry_stable_time_s: 0.45

    descent_rate_mps: 0.20
    touchdown_rate_mps: 0.09
    slow_height_above_platform_m: 0.42
    min_target_height_above_platform_m: 0.03
    pause_position_error_m: 0.14
    pause_relative_speed_mps: 0.12

    vision_abort_timeout_s: 0.60
    reacquire_climb_m: 0.28

    touchdown_z_tolerance_m: 0.08
    touchdown_vertical_speed_mps: 0.10
    touchdown_range_max_m: 0.14
    touchdown_confirm_time_s: 0.45
    use_extended_landed_state: true
    use_rangefinder: true
    range_required_for_touchdown: true
    range_topic: /mavros/distance_sensor/rangefinder_pub

    dwell_time_s: 5.00
    takeoff_prestream_s: 1.00
    takeoff_clearance_m: 0.42
    takeoff_reached_height_m: 1.20
    takeoff_max_wait_s: 8.0

  return_home:
    # 投掷后返航采用纯速度外环，速度上限在本节点中真正生效。
    # （调参）无人机返回起降点时保持的目标高度
    height_m: 1.20
    # （调参）返回起降点阶段允许的最大水平速度
    max_horizontal_speed_mps: 0.45
    # （调参）返回起降点阶段允许的最大水平加速度
    max_horizontal_accel_mps2: 0.30
    # （调参）返回起降点阶段允许的最大水平加速度变化率
    max_horizontal_jerk_mps3: 0.70
    # （调参）返回起降点阶段允许的最大垂直速度
    max_vertical_speed_mps: 0.22
    # （调参）返回起降点阶段允许的最大垂直加速度
    max_vertical_accel_mps2: 0.30
    # （调参）返回起降点时水平位置误差对应速度的比例增益
    position_kp: 0.55

    # ==================== 任务1：到H点上方直接AUTO.LAND ====================
    # 任务1不再先下降到0.3m；无人机保持 height_m 高度飞到H点上方，
    # 进入宽松到达区域后尝试连续稳定0.7s，满足或等待超过3s即直接AUTO.LAND。
    # （调参）认为已经到达H点上方、可以开始0.7s判稳的水平误差
    task1_arrival_position_tolerance_m: 0.18
    # （调参）认为已经到达返航目标高度、可以开始0.7s判稳的高度误差
    task1_arrival_z_tolerance_m: 0.18
    # （调参）任务1 AUTO.LAND 前连续判稳允许的水平位置误差
    task1_land_position_tolerance_m: 0.08
    # （调参）任务1 AUTO.LAND 前连续判稳允许的高度误差
    task1_land_z_tolerance_m: 0.15
    # （调参）任务1 AUTO.LAND 前连续判稳允许的水平速度
    task1_land_horizontal_speed_mps: 0.13
    # （调参）任务1 AUTO.LAND 前连续判稳允许的垂直速度
    task1_land_vertical_speed_mps: 0.15
    # （调参）任务1满足上述条件后需要连续稳定的时间
    task1_land_stable_time_s: 0.70
    # （调参）进入H点判稳阶段后最多等待时间；超时无条件请求AUTO.LAND
    task1_land_stabilize_timeout_s: 3.00

    # ==================== 任务2：保留原低空交接流程 ====================
    # （调参）进入降落阶段前允许的起降点水平误差
    position_tolerance_m: 0.08
    # （调参）进入降落阶段前允许的高度误差
    z_tolerance_m: 0.10
    # （调参）进入降落阶段前允许的无人机速度
    speed_tolerance_mps: 0.10
    # （调参）返航到位条件需要连续保持的时间
    stable_time_s: 1.00

    # 以下参数仅供任务2返航使用：到达H点上方后仍保持OFFBOARD，
    # 边修正XY边缓慢下降，降到较低高度后再交给PX4 AUTO.LAND。
    # （调参）受控下降阶段允许的最大水平修正速度
    landing_max_horizontal_speed_mps: 0.25
    # （调参）受控下降阶段允许的最大水平修正加速度
    landing_max_horizontal_accel_mps2: 0.25
    # （调参）受控下降阶段允许的最大水平加速度变化率
    landing_max_horizontal_jerk_mps3: 0.60
    # （调参）受控下降阶段对准起降点中心的比例增益
    landing_position_kp: 0.65
    # （调参）受控下降阶段的正常下降速度
    landing_descent_rate_mps: 0.15
    # （调参）接近地面时的最终下降速度
    landing_final_rate_mps: 0.08
    # （调参）切换最终慢速下降的高度范围
    landing_slow_height_m: 0.45
    # （调参）水平误差超过该值时暂停下降并优先回正
    landing_pause_xy_error_m: 0.10
    # （调参）水平速度超过该值时暂停下降
    landing_pause_horizontal_speed_mps: 0.12
    # （调参）OFFBOARD 受控下降交给 AUTO.LAND 的目标高度
    auto_land_handoff_height_m: 0.30
    # （调参）切换 AUTO.LAND 前允许的水平位置误差
    auto_land_xy_tolerance_m: 0.06
    # （调参）切换 AUTO.LAND 前允许的高度误差
    auto_land_z_tolerance_m: 0.05
    # （调参）切换 AUTO.LAND 前允许的水平速度
    auto_land_horizontal_speed_mps: 0.08
    # （调参）切换 AUTO.LAND 前允许的垂直速度
    auto_land_vertical_speed_mps: 0.08
    # （调参）AUTO.LAND 交接条件需要连续保持的时间
    auto_land_stable_time_s: 0.80
    # （调参）满足交接条件后请求 AUTO.LAND 前的准备时间
    auto_land_prepare_s: 0.30
    # （调参）AUTO.LAND 降落阶段允许的最长时间
    auto_land_timeout_s: 15.0

  safety:
    # （调参）小车数据持续丢失后触发返航的时间
    car_loss_return_s: 1.20
    # （调参）无人机定位持续丢失后触发自动降落的时间
    odometry_loss_auto_land_s: 0.70

vision:
  camera_index: 0
  width: 640
  height: 480
  fps: 30
  show_debug: false
  # （调参）降落标志视觉结果的发布频率
  publish_rate_hz: 25.0
  disabled_read_rate_hz: 3.0

  # （调参）起降标志外圆的实际直径
  outer_circle_diameter_m: 0.50
  # （调参）起降标志内外圆直径比例
  inner_outer_ratio: 0.60
  # （调参）内外圆直径比例允许误差
  ratio_tolerance: 0.18
  min_outer_diameter_px: 55
  max_outer_diameter_px: 620
  min_contour_area_px: 600
  min_circularity: 0.52
  max_pair_center_error_ratio: 0.18
  max_prediction_residual_px: 42.0
  max_diameter_change_ratio: 0.28
  # （调参）视觉结果允许发布的最低置信度
  min_publish_confidence: 0.45

  adaptive_block_size: 41
  adaptive_c: 7
  morphology_kernel: 3

  release_u: -1.0                  # -1 自动使用图像中心
  release_v: -1.0
  image_down_to_body_forward_sign: -1.0
  image_right_to_body_left_sign: -1.0
  # （调参）相机相对无人机控制中心的前后安装偏置
  camera_offset_forward_m: 0.0
  # （调参）相机相对无人机控制中心的左右安装偏置
  camera_offset_left_m: 0.0
  # （调参）相机像素焦距标定值
  focal_length_px: 520.0

udp_protocol:
  version: "1.2"
  strict_source_ip: true
  allow_gs_direct_start: false
  allow_legacy_format: true

  uav:
    listen_ip: 0.0.0.0
    listen_port: 8888

  ground_station:
    ip: 192.168.77.104           # 仅作回退；真车 launch 默认动态学习地面站 IP
    port: 8889

  car:
    ip: 192.168.77.102           # 当前真车 ESP32 静态 IP；现场变化时同步修改 launch/地面站
    port: 8890
    require_segment_consistency: true
    max_delay_compensation_s: 0.30

  reliability:
    dedup_cache_size: 32
    command_result_timeout_s: 0.22
    event_repeat: 3
    event_repeat_interval_s: 0.05

  telemetry:
    heartbeat_rate_hz: 1.0
    uav_rate_hz: 10.0

  # 协议中的 FIELD 坐标：场地左下角为 (0,0)，X 向右，Y 向上，单位 cm。
  # 下列参数把 MAVROS/Faster-LIO 的相对 H 点坐标转换为 FIELD 坐标。
  field_transform:
    h_field_x_cm: 75.0           # H 点中心距场地左边，按现场实测修正
    h_field_y_cm: 75.0           # H 点中心距场地下边，按现场实测修正
    local_x_to_field_yaw_deg: 0.0  # MAVROS local +X 在 FIELD 中的航向，必须标定

  # 用小车累计里程 path_s_cm 计算 segment_progress，并校验 segment。
  track:
    straight_length_m: 1.50
    radius_m: 0.75
    segment_boundary_tolerance_m: 0.08

# 以下两个节点为旧版原始 JSON 协议保留，正式 V1.1 launch 默认不再启动。
car_udp:
  bind_ip: 0.0.0.0
  bind_port: 8890
  socket_timeout_s: 0.05
  allow_text_commands: true
  auto_start_from_car: true

  # 当小车只发送 path_s / speed 时，使用下面的跑道模型换算位置。
  # 虚拟小车优先直接使用 FIELD 坐标定义赛道，再通过 field_transform
  # 自动换算为“以 H 为原点的 MAVROS local 坐标”，避免 x/y 人工互换出错。
  # FIELD：左下角为 (0,0)，X 向右，Y 向上，单位 cm。
  track:
    enabled: true
    coordinate_mode: field
    a_field_x_cm: 150.0             # A 点 FIELD X
    a_field_y_cm: 200.0             # A 点 FIELD Y
    ab_field_yaw_deg: 90.0          # A->B 沿 FIELD +Y
    # 以下 local 参数只作为旧配置兼容/诊断值。当前 H=(75,75)、local yaw=0 时应为 (0.75,1.25)。
    a_x_m: 0.75
    a_y_m: 1.25
    ab_yaw_deg: 90.0
    straight_length_m: 1.50
    radius_m: 0.75

  status_reply_enabled: true

actuator:
  enabled: true
  simulate: false
  port: /dev/ttyUSB0
  baud: 115200
  lock_command: A30
  release_command: A90
  manual_command_timeout_s: 1.80
  timeout_s: 0.35
  boot_wait_s: 2.0
  retry_count: 3
  retry_delay_s: 0.20
  ack_contains: OK
  line_ending: "\n"
  auto_detect: true

status_udp:
  enabled: false                    # 旧版无前缀 JSON 发送器，正式 V1.1 禁用
  target_ip: 192.168.151.101
  target_port: 8889
  max_rate_hz: 10.0
